<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockBot data picture guide</title>
<style>
:root{
  --bg:#f7f8fa; --card:#ffffff; --ink:#14181f; --muted:#4b5563; --line:#cbd2dc; --accent:#1d4ed8; --ok:#15803d; --bad:#b91c1c; --warn:#b45309; --shadow:rgba(15,23,42,.18);
  --g-price:#2563eb; --g-actions:#7c3aed; --g-earnings:#0e7490; --g-asm:#c2410c; --g-shares:#15803d; --g-staging:#475569; --g-legacy:#9d174d; --g-unused:#6b7280;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b; --card:#18202b; --ink:#e8edf4; --muted:#a8b3c3; --line:#3a4656; --accent:#7aa2ff; --ok:#4ade80; --bad:#f87171; --warn:#fbbf24; --shadow:rgba(0,0,0,.6);
    --g-price:#60a5fa; --g-actions:#a78bfa; --g-earnings:#22d3ee; --g-asm:#fb923c; --g-shares:#a3e635; --g-staging:#94a3b8; --g-legacy:#f472b6; --g-unused:#9ca3af;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141b; --card:#18202b; --ink:#e8edf4; --muted:#a8b3c3; --line:#3a4656; --accent:#7aa2ff; --ok:#4ade80; --bad:#f87171; --warn:#fbbf24; --shadow:rgba(0,0,0,.6);
  --g-price:#60a5fa; --g-actions:#a78bfa; --g-earnings:#22d3ee; --g-asm:#fb923c; --g-shares:#a3e635; --g-staging:#94a3b8; --g-legacy:#f472b6; --g-unused:#9ca3af;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
code{font-family:ui-monospace,Consolas,Menlo,monospace;font-size:.88em;background:color-mix(in srgb,var(--muted) 14%,transparent);padding:1px 5px;border-radius:4px;word-break:break-all}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{padding:12px 16px 0;max-width:1180px;margin:0 auto}
h1{margin:0;font-size:1.35rem}
.sub{margin:2px 0 8px;color:var(--muted);font-size:.9rem}
.bar{display:flex;gap:8px;align-items:center}
nav{flex:1;display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;border-bottom:1px solid var(--line)}
nav button{white-space:nowrap;border:1px solid transparent;background:none;padding:7px 11px;border-radius:8px 8px 0 0;color:var(--muted);font-weight:600;font-size:.92rem}
nav button[aria-selected="true"]{background:var(--card);border-color:var(--line);border-bottom-color:var(--card);color:var(--ink)}
#theme{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-size:.85rem}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;max-width:1180px;margin:0 auto;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--pk,var(--line));background:color-mix(in srgb,var(--pk,var(--muted)) 14%,var(--card));border-radius:999px;padding:3px 10px;font-size:.82rem;color:var(--ink)}
.chip i{width:10px;height:10px;border-radius:3px;background:var(--pk,var(--muted));display:inline-block}
.crumb{display:flex;gap:10px;align-items:center;padding:4px 16px;max-width:1180px;margin:0 auto;font-size:.88rem;color:var(--muted);flex-wrap:wrap}
.crumb button.back{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 12px;font-weight:600}
.crumb button.back:disabled{opacity:.45;cursor:default}
.crumb button.c{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline}
main{max-width:1180px;margin:0 auto;padding:8px 16px 28px}
body.panel-open main{margin-right:480px}
@media (max-width:1200px){body.panel-open main{margin-right:auto}}
.banner{background:color-mix(in srgb,var(--bad) 12%,var(--card));border:2px solid var(--bad);border-radius:10px;padding:10px 14px;font-weight:800;font-size:1.1rem;margin:6px 0 10px}
.hint{color:var(--muted);font-size:.9rem;margin:4px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.mdate{display:inline-block;font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:5px;white-space:nowrap;vertical-align:middle}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--ink);font-family:inherit}
svg .node rect{fill:color-mix(in srgb,var(--pk) 16%,var(--card));stroke:var(--pk);stroke-width:2.2}
svg .node{cursor:pointer}
svg .node:hover rect,svg .node:focus-visible rect,svg .node.sel rect{stroke-width:4;fill:color-mix(in srgb,var(--pk) 30%,var(--card))}
svg .node.dim{opacity:.25}
svg .node.missing rect{stroke:var(--bad);stroke-dasharray:6 4;fill:color-mix(in srgb,var(--bad) 10%,var(--card))}
svg .node.missing .sm{fill:var(--bad);font-weight:800}
svg .node.lit rect{stroke-width:4.5}
svg .node .nm{font-size:12px;font-weight:700}
svg .node .sm{font-size:10.5px;fill:var(--muted)}
svg .elab{font-size:11px;fill:var(--ink);font-weight:600}
svg .elab-bg{fill:var(--bg);stroke:var(--line)}
svg .ax{font-size:11px;fill:var(--muted)}
.edge{fill:none;stroke:var(--muted);stroke-width:1.6}
.edge.faint{opacity:.28;stroke-width:1.2}
.edge.logical{stroke-dasharray:7 5}
.edge.hot{stroke:var(--accent);stroke-width:3;opacity:1}
.edge.miss{stroke:var(--bad);stroke-width:2.4;stroke-dasharray:3 5}
.edge.once{stroke:var(--warn);stroke-width:2.2;stroke-dasharray:3 4}
.edge.anim{stroke:var(--accent);stroke-width:3.2;stroke-dasharray:8 6;animation:dash .9s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0b1020}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0b1020}}
.btn[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 22%,var(--card));border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:3px 10px;font-size:.82rem}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.item{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:6px solid var(--pk,var(--line));background:var(--card);border-radius:8px;padding:9px 12px}
.item b{display:block;word-break:break-word}
.item span.d{color:var(--muted);font-size:.88rem;display:block}
.item.off{opacity:.4}
.badge{display:inline-block;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle;border:1px solid var(--line)}
.badge.engine{color:var(--ok);border-color:var(--ok)}
.badge.warn,.badge.planned,.badge.missing{color:var(--bad);border-color:var(--bad)}
.badge.ro{color:var(--bad);border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.rows{font-weight:700;font-size:.92rem}
.term{border-bottom:2px dotted var(--accent);cursor:help}
#tip{position:fixed;z-index:60;max-width:300px;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:.85rem;line-height:1.35;display:none;box-shadow:0 4px 14px var(--shadow);pointer-events:none}
#tip b{display:block}
#panel{position:fixed;z-index:50;top:0;bottom:0;right:0;width:min(470px,100%);background:var(--card);border-left:6px solid var(--pk,var(--line));box-shadow:-6px 0 20px var(--shadow);overflow-y:auto;padding:14px 16px 24px;transform:translateX(105%);visibility:hidden;transition:transform .18s}
body.panel-open #panel{transform:none;visibility:visible}
#panel h2{margin:0 36px 4px 0;font-size:1.2rem;word-break:break-word}
#panel h3{margin:14px 0 4px;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
#panel p{margin:4px 0}
#panel ul{margin:4px 0;padding-left:0;list-style:none}
#panel li{padding:3px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
#panel .x{position:absolute;top:8px;right:8px;border:1px solid var(--line);background:var(--card);border-radius:8px;width:34px;height:34px;font-size:1.1rem}
#panel .more,#panel .src{color:var(--muted);font-size:.82rem;margin-top:12px}
#panel details{margin:8px 0;border:1px solid var(--line);border-radius:8px;padding:4px 10px}
#panel summary{cursor:pointer;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.9rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}
.cols li b{font-family:ui-monospace,Consolas,Menlo,monospace;font-size:.85rem}
.cols li .ty{color:var(--muted);font-size:.78rem;margin-left:6px}
.cols li .ex{color:var(--muted);font-size:.8rem;display:block}
.scroll{overflow-x:auto;max-width:100%}
table.t{border-collapse:collapse;font-size:.8rem}
table.t th,table.t td{border:1px solid var(--line);padding:2px 6px;text-align:left;white-space:nowrap}
table.t th{background:color-mix(in srgb,var(--muted) 12%,var(--card))}
table.w td,table.w th{white-space:normal}
table.w{font-size:.88rem;width:100%}
pre{background:color-mix(in srgb,var(--muted) 12%,var(--card));border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font-size:.8rem;white-space:pre-wrap;word-break:break-word}
@media (max-width:700px){
  .legend{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.legend .chip,.legend .hint{white-space:nowrap;flex:none}
  body.panel-open main{margin-right:auto}
  #panel{top:auto;left:0;right:0;width:100%;max-height:80vh;border-left:0;border-top:6px solid var(--pk,var(--line));border-radius:14px 14px 0 0;transform:translateY(105%)}
  h1{font-size:1.15rem}
}
.pipe{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.pipe button{border:2px solid var(--pk,var(--accent));background:color-mix(in srgb,var(--pk,var(--accent)) 14%,var(--card));border-radius:999px;padding:3px 10px;font-weight:700;font-size:.85rem}
.pipe button[aria-current="step"]{background:var(--pk,var(--accent));color:#fff}
:root[data-theme="dark"] .pipe button[aria-current="step"]{color:#0b1020}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pipe button[aria-current="step"]{color:#0b1020}}
.example{margin:8px 0;border:2px dashed var(--warn);border-radius:10px;padding:8px 12px;background:var(--card)}
.tag{display:inline-block;font-size:.7rem;font-weight:800;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:0 6px;margin-right:6px}
.stepbox{border:3px solid var(--pk);background:color-mix(in srgb,var(--pk) 12%,var(--card));border-radius:12px;padding:10px 12px}
.stepbox .t{font-size:1.15rem;font-weight:800;margin-bottom:2px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;margin-top:8px}
.fields div{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--card);font-size:.85rem}
.fields div.chg{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.fields b{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-family:ui-monospace,Consolas,Menlo,monospace}
.heads{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));margin:8px 0 12px}
.heads .h{border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:8px;padding:7px 10px;background:var(--card);font-size:.9rem}
.heads .h.missing{border-left-color:var(--bad)}
.heads .h b{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--warn)}
.heads .h.missing b{color:var(--bad)}
.dbs{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.db{position:relative;text-align:left;border:2px solid var(--pk);background:color-mix(in srgb,var(--pk) 9%,var(--card));border-radius:12px;padding:10px 12px;width:100%}
.db.lake{grid-column:1/-1;border-width:4px}
.db .ribbon{position:absolute;top:-1px;right:12px;background:var(--bad);color:#fff;font-weight:800;font-size:.75rem;padding:2px 10px;border-radius:0 0 8px 8px}
.db h3{margin:0;font-size:1.05rem;word-break:break-word}
.db .nick{color:var(--muted);font-size:.85rem}
.db dl{margin:6px 0 0;font-size:.86rem}
.sect{margin:14px 0 4px;padding-bottom:3px;border-bottom:3px solid var(--pk);font-size:1rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.sect small{color:var(--muted);font-weight:400}
input[type=search]{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%;max-width:520px}
input[type=range]{width:100%;max-width:640px;accent-color:var(--accent)}
details.g{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:6px 10px;margin:4px 0}
details.g summary{cursor:pointer;font-weight:700}
.charts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
@media (max-width:480px){.charts{grid-template-columns:1fr}}
.chart h3{margin:0 0 2px;font-size:1rem}
.icards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.ic{border:1px solid var(--line);border-top:5px solid var(--st,var(--warn));border-radius:10px;padding:10px 12px;background:var(--card)}
.ic .head{display:flex;gap:10px;align-items:center}
.ic svg.icon{width:44px;height:44px;flex:none;stroke:var(--st,var(--warn));fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic h3{margin:0;font-size:1rem}
.ic .tg{font-size:.72rem;font-weight:800;color:var(--muted)}
.ic .bt{margin:6px 0;border-left:4px solid var(--accent);padding-left:8px}
.ic.missing{--st:var(--bad)}
.ic.open{--st:var(--warn)}
.ic.fine{--st:var(--g-staging)}
.jr{border:1px solid var(--line);border-radius:6px;padding:4px 8px;margin:4px 0;font-family:ui-monospace,Consolas,Menlo,monospace;font-size:.78rem;background:var(--card);word-break:break-all}
.jr.new{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.two{grid-template-columns:1fr}}
.err{border:2px solid var(--bad);border-radius:8px;padding:8px 10px;background:color-mix(in srgb,var(--bad) 10%,var(--card));font-family:ui-monospace,Consolas,Menlo,monospace;font-size:.85rem;word-break:break-word}
.okbox{border:2px solid var(--ok);border-radius:8px;padding:8px 10px;background:color-mix(in srgb,var(--ok) 10%,var(--card));font-size:.9rem}
.qs{display:grid;gap:8px}
.qb{text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:8px 12px;font-weight:600}
.qb[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
footer{max-width:1180px;margin:0 auto;padding:10px 16px 24px;color:var(--muted);font-size:.82rem;border-top:1px solid var(--line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){#panel{transition:none}.edge.anim{animation:none}}
</style>
</head>
<body>
<header>
  <h1 id="ttl">StockBot data picture guide</h1>
  <p class="sub" id="sub"></p>
  <div class="bar"><nav id="tabs" role="tablist" aria-label="Views"></nav><button id="theme" type="button" aria-label="Switch light or dark colours">Theme: auto</button></div>
</header>
<div class="legend" id="legend" aria-label="Colour key: one colour per data group"></div>
<div class="crumb" id="crumb"></div>
<main id="main" tabindex="-1"><noscript>This guide needs JavaScript. The text version is docs/guides/DATA_GUIDE.md.</noscript></main>
<aside id="panel" role="dialog" aria-modal="false" aria-labelledby="ptitle" tabindex="-1"><button class="x" type="button" id="pclose" aria-label="Close panel">&times;</button><div id="pbody"></div></aside>
<div id="tip" role="tooltip"></div>
<footer><span id="foot"><!--__GUIDE_FOOTER__--></span> Text version: <code>docs/guides/DATA_GUIDE.md</code>.</footer>
<script type="application/json" id="guide-data">/*__GUIDE_DATA__*/</script>
<script>
"use strict";
(function () {
  var D = JSON.parse(document.getElementById("guide-data").textContent);
  var M = D.measured, MD = M.meta.measured_date;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); };
  var VIEWS = D.views, VIEW_IDS = VIEWS.map(function (v) { return v.id; });
  var GR = {}; D.groups.forEach(function (g) { GR[g.id] = g; });
  var TB = {}; D.tables.forEach(function (t) { TB[t.id] = t; });
  var gcol = function (id) { return "var(--g-" + id + ")"; };
  var narrow = window.matchMedia("(max-width: 700px)");
  var store = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } } };
  var nf = function (n) { return Number(n).toLocaleString("en-US"); };

  /* ---------- measured-number tokens: {{m:path|fmt}} are filled from the catalogue export embedded in the page ---------- */
  function segs(p) { var out = [], cur = "", depth = 0; for (var i = 0; i < p.length; i++) { var c = p.charAt(i); if (c === "[") depth++; if (c === "]") depth--; if (c === "." && !depth) { out.push(cur); cur = ""; } else cur += c; } out.push(cur); return out; }
  function getp(o, p) {
    segs(p).forEach(function (s) {
      if (o === null || o === undefined) return;
      var m = /^([^\[]*)\[([^=]+)=(.*)\]$/.exec(s);
      if (m) { if (m[1]) o = o[m[1]]; o = (o || []).filter(function (x) { return String(x[m[2]]) === m[3]; })[0]; } else o = o[s];
    });
    return o;
  }
  function tok(spec) {
    var parts = spec.split("|"), v = getp(M, parts[0]);
    if (v === undefined || v === null) return "?";
    var f = parts[1];
    if (f === "n") return nf(v);
    if (f === "len") return String(v.length);
    if (f && f.indexOf("uniq:") === 0) { var k = f.slice(5), seen = {}, c = 0; v.forEach(function (x) { if (!seen[x[k]]) { seen[x[k]] = 1; c++; } }); return String(c); }
    return String(v);
  }
  var F = function (s) { return String(s).replace(/\{\{m:([^}]+)\}\}/g, function (a, b) { return tok(b); }); };
  var X = function (s) { return esc(F(s)); };
  var meas = function () { return '<span class="mdate">measured ' + esc(MD) + "</span>"; };

  /* ---------- glossary terms: underlined once per container ---------- */
  var TERMS = D.glossary.map(function (g, i) { return { i: i, g: g }; }).sort(function (a, b) { return b.g.term.length - a.g.term.length; });
  var reEsc = function (s) { return s.replace(/[.*+?^${}()|[\]\\\/]/g, "\\$&"); };
  TERMS.forEach(function (t) { t.re = new RegExp("(?<![\\w-])" + reEsc(t.g.term) + "(?![\\w-])", t.g.term === t.g.term.toLowerCase() ? "i" : ""); });
  var seenMain = {}, seenPanel = {}, seen = seenMain;
  function T(text) {
    text = F(text); var m = [];
    TERMS.forEach(function (t) { if (seen[t.i]) return; var r = t.re.exec(text); if (r) m.push({ s: r.index, e: r.index + r[0].length, i: t.i }); });
    m.sort(function (a, b) { return a.s - b.s || (b.e - b.s) - (a.e - a.s); });
    var out = "", pos = 0;
    m.forEach(function (x) { if (x.s < pos) return; out += esc(text.slice(pos, x.s)) + '<span class="term" tabindex="0" data-t="' + x.i + '">' + esc(text.slice(x.s, x.e)) + "</span>"; pos = x.e; seen[x.i] = 1; });
    return out + esc(text.slice(pos));
  }
  var tip = $("#tip");
  function showTip(el) {
    var t = D.glossary[+el.getAttribute("data-t")];
    tip.innerHTML = "<b>" + esc(t.term) + "</b>" + esc(t.def); tip.style.display = "block";
    var r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    var x = Math.max(8, Math.min(window.innerWidth - w - 8, r.left)), y = r.bottom + 6; if (y + h > window.innerHeight - 8) y = Math.max(8, r.top - h - 6);

    h += '<div class="tbar" style="margin-top:8px"><button type="button" class="btn" data-act="tryupd">Try to UPDATE a journal row</button><button type="button" class="btn" data-act="rebuild">Rebuild from the journal</button></div><div id="liveout" aria-live="polite" class="hint">' + T(L.rebuild) + "</div>" + src(L.doc);
    h += '<h2 class="sect" style="--pk:' + gcol("asm") + '">ASM/GSM snapshot database <small>outside the repository</small></h2><div class="card">' + T(D.databases.filter(function (x) { return x.id === "asm"; })[0].plain) +
      "<p class=\"hint\">Tables: asm_gsm_daily_snapshot, asm_gsm_snapshot_raw, asm_gsm_snapshot_log. The lake holds a copy of the same data: " + M.coverage.asm_days.map(function (r) { return esc(r.framework) + " " + nf(r.rows); }).join(", ") + " rows on " + esc(M.coverage.asm_days[0].snapshot_date) + ". " + meas() + "</p></div>";
    var byName = {}; M.reference_files.forEach(function (r) { byName[r.file] = r; });
    h += '<h2 class="sect" style="--pk:' + gcol("actions") + '">Reference files <small>data/reference/ (rows measured ' + esc(MD) + ")</small></h2><div class=\"scroll\"><table class=\"t w\"><tr><th>File</th><th>Rows</th><th>What it is</th><th>Read by</th></tr>" +
      D.ref_files.map(function (f) { var r = byName[f.file]; return "<tr><td><code>" + esc(f.file) + "</code></td><td>" + (r ? nf(r.rows) : "?") + "</td><td>" + T(f.plain) + "</td><td><code>" + esc(f.read_by) + "</code></td></tr>"; }).join("") +
      D.ref_other.map(function (f) { return "<tr><td><code>" + esc(f.file) + "</code></td><td>" + esc(f.rows_note) + "</td><td>" + T(f.plain) + "</td><td><code>" + esc(f.read_by) + "</code></td></tr>"; }).join("") + "</table></div>";
    main.innerHTML = h + more("G and H");
  };

  /* ---------- 11 ask the data ---------- */
  var askSel = -1;
  function askAnswer() {
    if (askSel < 0) return '<div class="card">Pick a question on the left.</div>';
    var x = D.ask[askSel];
    return '<div class="card"><b>' + esc(x.q) + "</b><p>" + T(x.plain) + "</p><p>" + (x.tables.map(tchip).join(" ")) + (x.files || []).map(function (f) { return '<span class="chip" style="--pk:var(--g-actions)"><i></i>' + esc(f) + "</span>"; }).join(" ") + (x.dbs ? '<span class="chip" style="--pk:var(--g-staging)"><i></i>state/live_state.db</span>' : "") + "</p><p class=\"hint\">Method: " + T(x.method) + "</p></div>";
  }
  V.ask = function (a) {
    askSel = a !== "" && !isNaN(parseInt(a, 10)) ? Math.max(-1, Math.min(D.ask.length - 1, parseInt(a, 10))) : -1;
    var h = '<div class="two"><div><h3 style="margin:4px 0">Which table answers my question?</h3><div class="qs">' + D.ask.map(function (x, i) { return '<button type="button" class="qb" data-act="ask" data-id="' + i + '" aria-pressed="' + (i === askSel) + '">' + esc(x.q) + "</button>"; }).join("") + '</div></div><div><div id="askans">' + askAnswer() + "</div></div></div>";
    h += '<h3 style="margin:16px 0 4px">Five read-only SQL examples</h3><div class="card"><b>They open the database read-only.</b> Command pattern (the SQL goes in the last quotes):<pre id="pat">' + esc(D.open_ro) + '</pre><button type="button" class="btn sm" data-act="copy" data-t="pattern">Copy the pattern</button><p class="hint">' + esc(D.ask_note) + "</p></div>";
    D.queries.forEach(function (q, i) {
      h += '<div class="card" style="margin-top:8px"><b>' + (i + 1) + ". " + esc(q.title) + "</b><pre>" + esc(q.sql) + '</pre><div class="tbar"><button type="button" class="btn sm" data-act="copy" data-t="sql" data-id="' + i + '">Copy SQL</button><button type="button" class="btn sm" data-act="copy" data-t="cmd" data-id="' + i + '">Copy as command</button><span class="hint copied" id="cp' + i + '" aria-live="polite"></span></div><p class="hint">' + esc(q.returned) + ' <span class="mdate">' + esc(q.when) + "</span></p></div>";
    });
    main.innerHTML = h + more("K");
  };
  function copyText(text, id) {
    var done = function () { var e = $("#" + id); if (e) e.textContent = "Copied"; };
    var fallback = function () { var ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.top = "-1000px"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) { var e2 = $("#" + id); if (e2) e2.textContent = "Select the text and copy it by hand."; } document.body.removeChild(ta); };
    try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, fallback); return; } } catch (e) { /* fall through */ }
    fallback();
  }

  /* ---------- 12 glossary ---------- */
  var gq = "";
  function glossHtml() {
    var w = gq.toLowerCase();
    return D.glossary.map(function (g, i) { return { g: g, i: i }; }).filter(function (x) { return !w || (x.g.term + " " + x.g.def).toLowerCase().indexOf(w) >= 0; }).sort(function (a, b) { return a.g.term.toLowerCase() < b.g.term.toLowerCase() ? -1 : 1; })
      .map(function (x) { return '<details class="g"><summary>' + esc(x.g.term) + "</summary><p>" + esc(x.g.def) + "</p></details>"; }).join("") || '<div class="card">No such term.</div>';
  }
  V.glossary = function () {
    main.innerHTML = '<p class="hint">Words underlined with dots anywhere in this guide show their meaning on hover, focus or tap. All of them are here.</p><input type="search" id="gq" placeholder="Search terms" aria-label="Search the glossary" value="' + esc(gq) + '"><div id="gloss" style="margin-top:10px">' + glossHtml() + "</div>";
  };

  /* ---------- shell ---------- */
  var tabs = $("#tabs");
  tabs.innerHTML = VIEWS.map(function (v) { return '<button type="button" role="tab" id="tab-' + v.id + '" data-view="' + v.id + '">' + esc(v.label) + "</button>"; }).join("");
  $("#legend").innerHTML = '<span class="hint" style="margin:0 6px 0 0">Colour key:</span>' + D.groups.map(function (g) { return chip(g.id); }).join("");
  $("#ttl").textContent = D.meta.title; $("#sub").textContent = D.meta.subtitle;

  function crumb(r) {
    var vl = VIEWS.filter(function (v) { return v.id === r.v; })[0].label, last = "";
    if (r.a) {
      if (r.v === "tables" || r.v === "relations") last = r.a;
      else if (r.v === "big") last = (D.databases.filter(function (b) { return b.id === r.a; })[0] || { name: "" }).name;
      else if (r.v === "flow" || r.v === "row" || r.v === "other") last = r.a.indexOf("node-") === 0 ? (FN[r.a.slice(5)] || { label: "" }).label : "step " + r.a;
      else if (r.v === "time") last = "as-of " + (D.time.dates[parseInt(r.a, 10)] || "");
      else if (r.v === "actions") last = r.a;
      else if (r.v === "ask") last = "question " + r.a;
    }
    var up = document.body.classList.contains("panel-open") || r.v !== "big" || !!r.a;
    $("#crumb").innerHTML = '<button type="button" class="back" data-act="back"' + (up ? "" : " disabled") + '>&larr; Back</button><span>You are here:</span> <button type="button" class="c" data-act="home">Data guide</button> &rsaquo; ' +
      (last ? '<button type="button" class="c" data-act="view" data-v="' + r.v + '">' + esc(vl) + "</button> &rsaquo; <b>" + esc(last) + "</b>" : "<b>" + esc(vl) + "</b>");
  }
  function render() {
    var r = route();
    if (["flow", "row", "other"].indexOf(r.v) < 0) stopPlay();
    seenMain = {}; seenPanel = {}; seen = seenMain;
    document.body.classList.remove("panel-open");
    VIEW_IDS.forEach(function (id) { var b = $("#tab-" + id); b.setAttribute("aria-selected", id === r.v ? "true" : "false"); b.tabIndex = id === r.v ? 0 : -1; });
    V[r.v](r.a);
    crumb(r); document.title = "StockBot data picture guide: " + VIEWS.filter(function (v) { return v.id === r.v; })[0].label;
  }

  /* ---------- events ---------- */
  var STEPPED = { flow: function () { return D.flow_steps.length; }, row: function () { return D.row_steps.length; }, other: function () { return D.live.events.length; } };
  function curStep(r) { return r.v === "flow" && r.a.indexOf("node-") === 0 ? lastFlow : (parseInt(r.a, 10) || 0); }
  function stepGo(delta) { var r = route(), max = STEPPED[r.v](), n = Math.max(0, Math.min(max, curStep(r) + delta)); go(r.v, n); return n >= max; }
  function timeUpdate(i) {
    var body = $("#tbody"); if (!body) return;
    $("#slidev").textContent = D.time.dates[i]; $("#slide").setAttribute("aria-valuetext", D.time.dates[i]); body.innerHTML = timeBody(i);
    try { history.replaceState(null, "", "#time/" + i); } catch (e) { /* ignore */ }
    crumb({ v: "time", a: String(i) });
  }
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act],[data-view],.term"); if (!t) return;
    if (t.classList.contains("term")) { e.stopPropagation(); showTip(t); return; }
    if (t.hasAttribute("data-view")) { stopPlay(); go(t.getAttribute("data-view")); return; }
    var act = t.getAttribute("data-act"), id = t.getAttribute("data-id"), r = route();
    switch (act) {
      case "db": go("big", id); break;
      case "tbl": go("tables", id); break;
      case "engfilter": store.set("sb-engine", t.getAttribute("data-v")); render(); break;
      case "er": go("relations", id); break;
      case "lkey": go("relations", id === r.a ? "" : id); break;
      case "fnode": go("flow", "node-" + id); break;
      case "fstep": stopPlay(); go("flow", t.getAttribute("data-n")); break;
      case "rstep": stopPlay(); go("row", t.getAttribute("data-n")); break;
      case "st-next": stopPlay(); stepGo(1); break;
      case "st-back": stopPlay(); stepGo(-1); break;
      case "st-reset": stopPlay(); go(r.v, 0); break;
      case "st-play":
        if (playTimer) { stopPlay(); render(); break; }
        if (curStep(route()) >= STEPPED[route().v]()) go(route().v, 0);
        playTimer = setInterval(function () { if (stepGo(1)) { stopPlay(); render(); } }, 2600); stepGo(1); break;
      case "tset": { var n = parseInt(t.getAttribute("data-n"), 10); $("#slide").value = n; timeUpdate(n); break; }
      case "future": { var i = +$("#slide").value, later = D.time.dates[i + 1] || "2030-01-18"; $("#tresult").className = ""; $("#tresult").innerHTML = '<div class="err">FutureDataError: ' + esc(D.time.error_text.replace("{later}", later).replace("{as_of}", D.time.dates[i])) + "</div>"; break; }
      case "today": { var j = +$("#slide").value, b = timeState(j).bars[j]; $("#tresult").className = ""; $("#tresult").innerHTML = '<div class="okbox">The bar for ' + esc(b.d) + " is visible: close_raw " + b.raw + ".</div>"; break; }
      case "amode": actMode = t.getAttribute("data-v"); render(); break;
      case "atype": go("actions", id); break;
      case "tryupd": $("#liveout").innerHTML = '<div class="err">UPDATE journal SET ... &rarr; aborted: ' + esc(D.live.trigger_message) + "</div>"; break;
      case "rebuild": { var nn = curStep(route()); $("#liveout").innerHTML = nn ? '<div class="okbox">Folded ' + nn + " journal row(s) from the first one. Result: cash " + nf(D.live.events[nn - 1].cash) + ", positions " + esc(D.live.events[nn - 1].positions.join(", ") || "none") + ". It equals the stored snapshot.</div>" : '<div class="err">The journal is empty: nothing to rebuild. Press Next first.</div>'; break; }
      case "ask": go("ask", id); break;
      case "copy": {
        var kind = t.getAttribute("data-t"), qi = parseInt(id, 10), text = kind === "pattern" ? D.open_ro : kind === "sql" ? D.queries[qi].sql : D.open_ro.replace("<SQL>", D.queries[qi].sql);
        copyText(text, kind === "pattern" ? "cp-pat" : "cp" + qi); if (kind === "pattern") { var pe = $("#cp-pat"); if (!pe) { pe = document.createElement("span"); pe.id = "cp-pat"; pe.className = "hint"; pe.setAttribute("aria-live", "polite"); t.insertAdjacentElement("afterend", pe); copyText(text, "cp-pat"); } }
        break;
      }
      case "back": if (document.body.classList.contains("panel-open") || r.a) go(r.v); else go("big"); break;
      case "home": go("big"); break;
      case "view": go(t.getAttribute("data-v")); break;
    }
  });
  document.addEventListener("click", function (e) { if (!e.target.closest(".term")) hideTip(); }, true);
  $("#pclose").addEventListener("click", function () { var r = route(); go(r.v, r.v === "flow" ? lastFlow : ""); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { hideTip(); if (document.body.classList.contains("panel-open")) { var r0 = route(); go(r0.v, r0.v === "flow" ? lastFlow : ""); } return; }
    var t = e.target;
    if ((e.key === "Enter" || e.key === " ") && t.getAttribute && t.getAttribute("role") === "button" && t.tagName.toLowerCase() === "g") { e.preventDefault(); t.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
    if ((e.key === "Enter" || e.key === " ") && t.classList && t.classList.contains("term")) { e.preventDefault(); showTip(t); }
    if ((e.key === "ArrowRight" || e.key === "ArrowLeft") && t.getAttribute && t.getAttribute("role") === "tab") {
      var i = VIEW_IDS.indexOf(t.getAttribute("data-view")) + (e.key === "ArrowRight" ? 1 : -1); i = (i + VIEW_IDS.length) % VIEW_IDS.length; go(VIEW_IDS[i]); $("#tab-" + VIEW_IDS[i]).focus();
    }
    var rv = route().v;
    if (STEPPED[rv] && t.closest && !t.closest("input") && !t.getAttribute("role") && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { stopPlay(); stepGo(e.key === "ArrowRight" ? 1 : -1); }
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "tq") { tq = e.target.value; seen = seenMain = {}; $("#tlist").innerHTML = tablesHtml(); }
    if (e.target.id === "gq") { gq = e.target.value; $("#gloss").innerHTML = glossHtml(); }
    if (e.target.id === "slide") timeUpdate(+e.target.value);
  });
  document.addEventListener("mouseover", function (e) { var t = e.target.closest(".term,[data-tip]"); if (!t) return; if (t.classList.contains("term")) showTip(t); else showNodeTip(t); });
  document.addEventListener("mouseout", function (e) { var t = e.target.closest(".term,[data-tip]"); if (t) hideTip(); });
  document.addEventListener("focusin", function (e) { var t = e.target.closest && e.target.closest(".term,g[data-tip]"); if (!t) return; if (t.classList.contains("term")) showTip(t); else showNodeTip(t); });
  document.addEventListener("focusout", hideTip);
  window.addEventListener("hashchange", function () { hideTip(); render(); });
  narrow.addEventListener("change", render);
  window.addEventListener("scroll", hideTip, true);

  var themeBtn = $("#theme"), modes = ["auto", "light", "dark"];
  function applyTheme(m) { if (m === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", m); themeBtn.textContent = "Theme: " + m; }
  var tm = store.get("sb-theme"); applyTheme(modes.indexOf(tm) >= 0 ? tm : "auto");
  themeBtn.addEventListener("click", function () { var cur = store.get("sb-theme"); var nx = modes[(modes.indexOf(cur) + 1 + modes.length) % modes.length]; if (modes.indexOf(cur) < 0) nx = "light"; store.set("sb-theme", nx); applyTheme(nx); });

  render();
})();
</script>
</body>
</html>
