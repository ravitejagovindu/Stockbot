<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockBot picture guide</title>
<style>
:root{
  --bg:#f7f8fa; --card:#ffffff; --ink:#14181f; --muted:#4b5563; --line:#cbd2dc; --accent:#1d4ed8; --ok:#15803d; --bad:#b91c1c; --warn:#b45309; --shadow:rgba(15,23,42,.18);
  --pk-config:#64748b; --pk-data:#2563eb; --pk-universe:#0e7490; --pk-risk:#b45309; --pk-engine:#7c3aed; --pk-strategies:#15803d; --pk-backtest:#be185d; --pk-live:#c2410c;
  --pk-validation:#0f766e; --pk-data_checks:#4d7c0f; --pk-scripts:#475569; --pk-tests:#475569; --pk-docs:#475569; --pk-data_dir:#475569;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b; --card:#18202b; --ink:#e8edf4; --muted:#a8b3c3; --line:#3a4656; --accent:#7aa2ff; --ok:#4ade80; --bad:#f87171; --warn:#fbbf24; --shadow:rgba(0,0,0,.6);
    --pk-config:#94a3b8; --pk-data:#60a5fa; --pk-universe:#22d3ee; --pk-risk:#fbbf24; --pk-engine:#a78bfa; --pk-strategies:#4ade80; --pk-backtest:#f472b6; --pk-live:#fb923c;
    --pk-validation:#2dd4bf; --pk-data_checks:#a3e635; --pk-scripts:#94a3b8; --pk-tests:#94a3b8; --pk-docs:#94a3b8; --pk-data_dir:#94a3b8;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141b; --card:#18202b; --ink:#e8edf4; --muted:#a8b3c3; --line:#3a4656; --accent:#7aa2ff; --ok:#4ade80; --bad:#f87171; --warn:#fbbf24; --shadow:rgba(0,0,0,.6);
  --pk-config:#94a3b8; --pk-data:#60a5fa; --pk-universe:#22d3ee; --pk-risk:#fbbf24; --pk-engine:#a78bfa; --pk-strategies:#4ade80; --pk-backtest:#f472b6; --pk-live:#fb923c;
  --pk-validation:#2dd4bf; --pk-data_checks:#a3e635; --pk-scripts:#94a3b8; --pk-tests:#94a3b8; --pk-docs:#94a3b8; --pk-data_dir:#94a3b8;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
code{font-family:ui-monospace,Consolas,Menlo,monospace;font-size:.88em;background:color-mix(in srgb,var(--muted) 14%,transparent);padding:1px 5px;border-radius:4px;word-break:break-all}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{padding:12px 16px 0;max-width:1180px;margin:0 auto}
h1{margin:0;font-size:1.35rem}
.sub{margin:2px 0 8px;color:var(--muted);font-size:.9rem}
.bar{display:flex;gap:8px;align-items:center}
nav{flex:1;display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;border-bottom:1px solid var(--line)}
nav button{white-space:nowrap;border:1px solid transparent;background:none;padding:7px 11px;border-radius:8px 8px 0 0;color:var(--muted);font-weight:600;font-size:.92rem}
nav button[aria-selected="true"]{background:var(--card);border-color:var(--line);border-bottom-color:var(--card);color:var(--ink)}
#theme{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-size:.85rem}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;max-width:1180px;margin:0 auto}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--pk,var(--line));background:color-mix(in srgb,var(--pk,var(--muted)) 14%,var(--card));border-radius:999px;padding:3px 10px;font-size:.82rem;color:var(--ink)}
.chip i{width:10px;height:10px;border-radius:3px;background:var(--pk,var(--muted));display:inline-block}
.chip.folder{border-style:dashed}
.crumb{display:flex;gap:10px;align-items:center;padding:4px 16px;max-width:1180px;margin:0 auto;font-size:.88rem;color:var(--muted);flex-wrap:wrap}
.crumb button.back{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 12px;font-weight:600}
.crumb button.back:disabled{opacity:.45;cursor:default}
.crumb a,.crumb button.c{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline}
main{max-width:1180px;margin:0 auto;padding:8px 16px 28px}
body.panel-open main{margin-right:420px}
@media (max-width:1180px){body.panel-open main{margin-right:auto}}
.banner{background:color-mix(in srgb,var(--accent) 12%,var(--card));border:1px solid var(--accent);border-radius:10px;padding:10px 14px;font-weight:700;font-size:1.05rem;margin:6px 0 10px}
.hint{color:var(--muted);font-size:.9rem;margin:4px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--ink);font-family:inherit}
svg .node rect{fill:color-mix(in srgb,var(--pk) 16%,var(--card));stroke:var(--pk);stroke-width:2.2}
svg .node.folder rect{stroke-dasharray:6 4}
svg .node{cursor:pointer}
svg .node:hover rect,svg .node:focus-visible rect,svg .node.sel rect{stroke-width:4;fill:color-mix(in srgb,var(--pk) 30%,var(--card))}
svg .node.dim{opacity:.28}
svg .node .nm{font-size:15px;font-weight:700}
svg .node .sm{font-size:12px;fill:var(--muted)}
svg .elab{font-size:12px;fill:var(--muted)}
svg .elab-bg{fill:var(--bg)}
.edge{fill:none;stroke:var(--muted);stroke-width:1.6}
.edge.faint{opacity:.22;stroke-width:1.2}
.edge.ok{stroke:var(--ok);stroke-width:2.6}
.edge.no{stroke:var(--bad);stroke-width:2.2;stroke-dasharray:7 5}
.edge.tmp{stroke:var(--warn);stroke-width:2.6;stroke-dasharray:3 4}
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0b1020}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0b1020}}
.btn[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 22%,var(--card));border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.list{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.item{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:6px solid var(--pk,var(--line));background:var(--card);border-radius:8px;padding:9px 12px}
.item b{display:block}
.item span{color:var(--muted);font-size:.88rem}
.badge{display:inline-block;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle;border:1px solid var(--line)}
.badge.planned{color:var(--warn);border-color:var(--warn)}
.badge.daily{color:var(--ok);border-color:var(--ok)}
.term{border-bottom:2px dotted var(--accent);cursor:help}
#tip{position:fixed;z-index:60;max-width:300px;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:.85rem;line-height:1.35;display:none;box-shadow:0 4px 14px var(--shadow);pointer-events:none}
#tip b{display:block}
#panel{position:fixed;z-index:50;top:0;bottom:0;right:0;width:min(420px,100%);background:var(--card);border-left:6px solid var(--pk,var(--line));box-shadow:-6px 0 20px var(--shadow);overflow-y:auto;padding:14px 16px 24px;transform:translateX(105%);visibility:hidden;transition:transform .18s}
body.panel-open #panel{transform:none;visibility:visible}
#panel h2{margin:0 36px 4px 0;font-size:1.2rem}
#panel h3{margin:14px 0 4px;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
#panel p{margin:4px 0}
#panel ul{margin:4px 0;padding-left:0;list-style:none}
#panel li{padding:3px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
#panel .x{position:absolute;top:8px;right:8px;border:1px solid var(--line);background:var(--card);border-radius:8px;width:34px;height:34px;font-size:1.1rem}
#panel .chips{display:flex;flex-wrap:wrap;gap:6px}
#panel .chip.no{--pk:var(--bad)}
#panel .chip.yes{--pk:var(--ok)}
#panel .more,#panel .src{color:var(--muted);font-size:.82rem;margin-top:12px}
pre{background:color-mix(in srgb,var(--muted) 12%,var(--card));border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font-size:.8rem;white-space:pre-wrap}
@media (max-width:700px){
  .legend{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.legend .chip,.legend .hint{white-space:nowrap;flex:none}
  body.panel-open main{margin-right:auto}
  #panel{top:auto;left:0;right:0;width:100%;max-height:78vh;border-left:0;border-top:6px solid var(--pk,var(--line));border-radius:14px 14px 0 0;transform:translateY(105%)}
  h1{font-size:1.15rem}
}
.pipe{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.pipe button{border:2px solid var(--pk);background:color-mix(in srgb,var(--pk) 14%,var(--card));border-radius:999px;padding:3px 10px;font-weight:700;font-size:.85rem}
.pipe button[aria-current="step"]{background:var(--pk);color:#fff}
:root[data-theme="dark"] .pipe button[aria-current="step"]{color:#0b1020}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pipe button[aria-current="step"]{color:#0b1020}}
.stage{display:grid;grid-template-columns:1fr auto 1.4fr auto 1fr;gap:8px;align-items:stretch;margin:6px 0}
.stage .arrow{align-self:center;font-size:1.6rem;color:var(--muted)}
.io{border:1px dashed var(--line);border-radius:10px;padding:8px 10px;background:var(--card);font-size:.92rem}
.io h4,.stepbox h4{margin:0 0 2px;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.stepbox{border:3px solid var(--pk);background:color-mix(in srgb,var(--pk) 14%,var(--card));border-radius:12px;padding:10px 12px}
.stepbox .t{font-size:1.15rem;font-weight:800;margin-bottom:2px}
.example{margin:8px 0;border:2px dashed var(--warn);border-radius:10px;padding:8px 12px;background:var(--card)}
.example .tag{display:inline-block;font-size:.7rem;font-weight:800;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:0 6px;margin-right:6px}
.track{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:4px;margin-top:8px}
.track div{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:.78rem;color:var(--muted);background:var(--card)}
.track div.now{border-color:var(--accent);color:var(--ink);font-weight:700;background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.track div.future{opacity:.45}
@media (max-width:700px){.stage{grid-template-columns:1fr}.stage .arrow{transform:rotate(90deg);justify-self:center}}
.lanes{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.lanes h3{margin:0;font-size:1rem;text-align:center}
.lane{display:flex;flex-direction:column;gap:6px}
.lane .item{--pk:var(--pk-backtest)}
.lane.live .item{--pk:var(--pk-live)}
.shared{grid-column:1/-1;text-align:center;border:3px solid var(--pk-engine);background:color-mix(in srgb,var(--pk-engine) 18%,var(--card));border-radius:12px;padding:10px;font-weight:800;font-size:1.1rem;cursor:pointer;width:100%}
.shared small{display:block;font-weight:500;color:var(--muted)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.flow .step{flex:1 1 150px;max-width:230px;min-width:130px;text-align:left;border:2px solid var(--pk,var(--line));background:color-mix(in srgb,var(--pk,var(--muted)) 10%,var(--card));border-radius:10px;padding:8px 10px;position:relative}
.flow .step[aria-current="step"]{background:color-mix(in srgb,var(--pk) 32%,var(--card));box-shadow:0 0 0 3px var(--accent)}
.flow .step.past{opacity:.7}
.flow .step b{display:block}
.flow .step small{color:var(--muted)}
.flow .arr{align-self:center;color:var(--muted);font-size:1.3rem}
.tag-row{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.tg{font-size:.7rem;font-weight:700;border-radius:6px;padding:0 6px;border:1px solid var(--warn);color:var(--warn)}
.tg.caps{border-color:var(--pk-risk);color:var(--pk-risk)}
.tg.slippage{border-color:var(--bad);color:var(--bad)}
.side{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.side div{border:2px dashed var(--bad);border-radius:10px;padding:6px 10px;font-size:.88rem;background:var(--card);flex:1 1 240px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.cols,.lanes{grid-template-columns:1fr}.lanes{gap:8px}}
.cols h3{margin:6px 0}
.chk{display:flex;gap:8px;align-items:flex-start}
.chk input{width:22px;height:22px;margin-top:8px}
.never .item{--pk:var(--bad)}
.two{display:flex;gap:10px;align-items:center;justify-content:center;margin:8px 0;flex-wrap:wrap}
.two .sbox{border:2px solid var(--pk-strategies);background:color-mix(in srgb,var(--pk-strategies) 14%,var(--card));border-radius:8px;padding:6px 14px;font-weight:700}
.two .x{color:var(--bad);font-size:2rem;font-weight:900}
input[type=search]{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%;max-width:520px}
details.g{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:6px 10px;margin:4px 0}
details.g summary{cursor:pointer;font-weight:700}
.sym{display:grid;gap:8px}
.sym .card b{display:block}
footer{max-width:1180px;margin:0 auto;padding:10px 16px 24px;color:var(--muted);font-size:.82rem;border-top:1px solid var(--line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){#panel{transition:none}}
</style>
</head>
<body>
<header>
  <h1 id="ttl">StockBot picture guide</h1>
  <p class="sub" id="sub"></p>
  <div class="bar"><nav id="tabs" role="tablist" aria-label="Views"></nav><button id="theme" type="button" aria-label="Switch light or dark colours">Theme: auto</button></div>
</header>
<div class="legend" id="legend" aria-label="Colour key: one colour per package"></div>
<div class="crumb" id="crumb"></div>
<main id="main" tabindex="-1"><noscript>This guide needs JavaScript. The text version is docs/guides/CODEBASE_GUIDE.md.</noscript></main>
<aside id="panel" role="dialog" aria-modal="false" aria-labelledby="ptitle" tabindex="-1"><button class="x" type="button" id="pclose" aria-label="Close panel">&times;</button><div id="pbody"></div></aside>
<div id="tip" role="tooltip"></div>
<footer><span id="foot"><!--__GUIDE_FOOTER__--></span> Text version: <code>docs/guides/CODEBASE_GUIDE.md</code>.</footer>
<script type="application/json" id="guide-data">/*__GUIDE_DATA__*/</script>

  /* ---------- shell: tabs, legend, breadcrumb, render ---------- */
  var tabs = $("#tabs");
  tabs.innerHTML = VIEWS.map(function (v) { return '<button type="button" role="tab" id="tab-' + v.id + '" data-view="' + v.id + '">' + esc(v.label) + "</button>"; }).join("");
  $("#legend").innerHTML = '<span class="hint" style="margin:0 6px 0 0;align-self:center">Colour key:</span>' + PKGS.map(function (p) { return chip(p.id); }).join("") + '<span class="chip folder" style="--pk:var(--pk-scripts)"><i></i>folders (scripts, tests, docs, data)</span>';
  $("#ttl").textContent = D.meta.title; $("#sub").textContent = D.meta.subtitle;

  function crumb(r) {
    var vl = VIEWS.filter(function (v) { return v.id === r.v; })[0].label, last = "";
    if (r.a) { if (PK[r.a]) last = PK[r.a].name; else if (r.a.indexOf("b-") === 0) last = (D.blocks.filter(function (b) { return "b-" + b.id === r.a; })[0] || { title: "" }).title; else last = ({ engine: "step " + r.a, trade: "step " + r.a })[r.v] || r.a; }
    var up = document.body.classList.contains("panel-open") || r.v !== "big";
    $("#crumb").innerHTML = '<button type="button" class="back" data-act="back"' + (up ? "" : " disabled") + '>&larr; Back</button><span>You are here:</span> <button type="button" class="c" data-act="home">StockBot</button> &rsaquo; ' +
      (last ? '<button type="button" class="c" data-act="view" data-v="' + r.v + '">' + esc(vl) + "</button> &rsaquo; <b>" + esc(last) + "</b>" : "<b>" + esc(vl) + "</b>");
  }

  function render() {
    var r = route();
    if (r.v !== "engine" && r.v !== "trade") stopPlay();
    seenMain = {}; seenPanel = {}; seen = seenMain;
    var hadPanel = document.body.classList.contains("panel-open");
    document.body.classList.remove("panel-open"); if (hadPanel) { /* keep focus logic simple */ }
    VIEW_IDS.forEach(function (id) { var b = $("#tab-" + id); b.setAttribute("aria-selected", id === r.v ? "true" : "false"); b.tabIndex = id === r.v ? 0 : -1; });
    V[r.v](r.a);
    crumb(r); document.title = "StockBot picture guide: " + VIEWS.filter(function (v) { return v.id === r.v; })[0].label;
    if (!r.a) { var inp = $("#q") || $("#gq"); void inp; }
  }

  /* ---------- events ---------- */
  function stepGo(delta) { var r = route(), max = r.v === "engine" ? D.engine_steps.length : D.trade_steps.length, n = Math.max(0, Math.min(max, (parseInt(r.a, 10) || 0) + delta)); go(r.v, n); return n >= max; }
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act],[data-view],.term"); if (!t) return;
    if (t.classList.contains("term")) { e.stopPropagation(); showTip(t); return; }
    if (t.hasAttribute("data-view")) { stopPlay(); go(t.getAttribute("data-view")); return; }
    var act = t.getAttribute("data-act"), id = t.getAttribute("data-id"), r = route();
    switch (act) {
      case "pkg": openPkg(id); break;
      case "block": go("big", "b-" + id); break;
      case "imp": go("imports", id); break;
      case "filter": store.set("sb-daily", t.getAttribute("data-v")); render(); break;
      case "step": stopPlay(); go("engine", t.getAttribute("data-n")); break;
      case "tstep": stopPlay(); go("trade", t.getAttribute("data-n")); break;
      case "st-next": stopPlay(); stepGo(1); break;
      case "st-back": stopPlay(); stepGo(-1); break;
      case "st-reset": stopPlay(); go(r.v, 0); break;
      case "st-play":
        if (playTimer) { stopPlay(); render(); break; }
        { var rr = route(); if ((parseInt(rr.a, 10) || 0) >= (rr.v === "engine" ? D.engine_steps.length : D.trade_steps.length)) go(rr.v, 0); }
        playTimer = setInterval(function () { if (stepGo(1)) { stopPlay(); render(); } }, 2600); stepGo(1); break;
      case "lane": go("lanes", id); break;
      case "add": go("add", id); break;
      case "val": go("validation", id); break;
      case "tick": { var d = {}; try { d = JSON.parse(store.get("sb-add") || "{}"); } catch (x) { d = {}; } d[id] = t.checked; store.set("sb-add", JSON.stringify(d)); render(); break; }
      case "back": if (document.body.classList.contains("panel-open")) go(r.v); else go("big"); break;
      case "home": go("big"); break;
      case "view": go(t.getAttribute("data-v")); break;
    }
  });
  document.addEventListener("click", function (e) { if (!e.target.closest(".term")) hideTip(); }, true);
  $("#pclose").addEventListener("click", function () { go(route().v); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { hideTip(); if (document.body.classList.contains("panel-open")) go(route().v); return; }
    var t = e.target;
    if ((e.key === "Enter" || e.key === " ") && t.getAttribute && t.getAttribute("role") === "button" && t.tagName.toLowerCase() === "g") { e.preventDefault(); t.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
    if ((e.key === "Enter" || e.key === " ") && t.classList && t.classList.contains("term")) { e.preventDefault(); showTip(t); }
    if ((e.key === "ArrowRight" || e.key === "ArrowLeft") && t.getAttribute && t.getAttribute("role") === "tab") {
      var i = VIEW_IDS.indexOf(t.getAttribute("data-view")) + (e.key === "ArrowRight" ? 1 : -1); i = (i + VIEW_IDS.length) % VIEW_IDS.length; go(VIEW_IDS[i]); $("#tab-" + VIEW_IDS[i]).focus();
    }
    if (route().v === "engine" || route().v === "trade") { if (e.target.closest && !e.target.closest("input") && (e.key === "ArrowRight" || e.key === "ArrowLeft") && !t.getAttribute("role")) { stopPlay(); stepGo(e.key === "ArrowRight" ? 1 : -1); } }
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "q") { q = e.target.value; seen = seenMain = {}; $("#symlist").innerHTML = symHtml(); }
    if (e.target.id === "gq") { gq = e.target.value; $("#gloss").innerHTML = glossHtml(); }
  });
  document.addEventListener("mouseover", function (e) { var t = e.target.closest(".term,[data-tip]"); if (!t) return; if (t.classList.contains("term")) showTip(t); else showNodeTip(t); });
  document.addEventListener("mouseout", function (e) { var t = e.target.closest(".term,[data-tip]"); if (t) hideTip(); });
  document.addEventListener("focusin", function (e) { var t = e.target.closest && e.target.closest(".term,g[data-tip]"); if (!t) return; if (t.classList.contains("term")) showTip(t); else showNodeTip(t); });
  document.addEventListener("focusout", hideTip);
  window.addEventListener("hashchange", function () { hideTip(); render(); });
  narrow.addEventListener("change", render);
  window.addEventListener("scroll", hideTip, true);

  /* theme: auto, light, dark */
  var themeBtn = $("#theme"), modes = ["auto", "light", "dark"];
  function applyTheme(m) { if (m === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", m); themeBtn.textContent = "Theme: " + m; }
  var tm = store.get("sb-theme"); applyTheme(modes.indexOf(tm) >= 0 ? tm : "auto");
  themeBtn.addEventListener("click", function () { var cur = store.get("sb-theme"); var nx = modes[(modes.indexOf(cur) + 1 + modes.length) % modes.length]; if (modes.indexOf(cur) < 0) nx = "light"; store.set("sb-theme", nx); applyTheme(nx); });

  render();
})();
</script>
</body>
</html>
