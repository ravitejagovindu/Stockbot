# backtest/pre_registered_configs.yaml — Formally Pre-Registered Tuning Configurations
# Pre-registered prior to running simulations, as required by the Reviewer Protocol.
# Trials Budget: Exactly 6 candidate configurations + 1 baseline reference. No second grid round allowed.

metadata:
  created_at: "2026-10-24T18:40:00+05:30"
  status: "PRE_REGISTERED_LOCKED"
  description: >
    Factorial grid testing Trend Continuation (No Breakout) vs. Pullback to SMA20 triggers
    under Relative Strength percentile ranking (Top 50% vs Top 40% vs Top 30%) and Opening Gap limit (1.5%).
    Justified by trade-count feasibility (breakouts combined with RS cuts suffer severe trade starvation in W1,
    yielding only 12 trades and violating the 20-trade floor) and testing whether entering on consolidations/pullbacks
    below 52-week highs avoids buying the exhaustion top of breakouts. The 2015-2019 TEST window is strictly preserved and untouched.

definitions:
  forward_returns:
    formula: "ret_h = (Close[ed + h] / FillPrice - 1.0) * 100"
    timing: "Close of the h-th trading session after entry date ed (trade_date > ed). Specifically T+1, T+5, T+10, T+20."

  relative_strength:
    universe: "Screened liquid universe on date T passing Gates 1-3 (Market Cap > Rs. 5000cr, 20-day ADTV > Rs. 25cr, Listing Age > 252 trading days), excluding index symbols and ASM/GSM."
    lookback_sessions: 63  # Approximately 3 calendar months
    formula: "close_adj[T] / close_adj[T - 63] - 1.0"
    percentile_cutoff: "On date T, threshold Q_p is defined as the (100 - percentile)-th percentile of rs_3m across all stocks in the screened liquid universe (e.g. 70th percentile for Top 30%, 60th percentile for Top 40%, 50th percentile for Top 50%)."
    filtering_rule: "A candidate passing technical triggers (trend, breakout/pullback) qualifies if and only if its individual rs_3m >= Q_p. Thin-day distortion is strictly eliminated because candidates must clear the true broad market threshold."
    tie_handling: "Deterministic secondary sort by symbol ascending ('symbol' ASC)."

  pullback_trigger:
    trend_condition: "close_adj[T] > sma50_adj[T] > sma200_adj[T]"
    sma_period: 20
    band_lower: 0.98
    band_upper: 1.03
    formula: "band_lower * sma20_adj[T] <= close_adj[T] <= band_upper * sma20_adj[T]"
    rationale: "Identifies stocks in established primary uptrends that are consolidating within 3% of the 20-day SMA, allowing entry with structural support and positive R:R to prior 52-week resistance."

  market_breadth:
    universe: "Screened liquid universe on date T passing Gates 1-3."
    timing: "Evaluated at prior close T (fully known prior to NEXT_OPEN entry execution at T+1)."
    formula: "Percentage of stocks in the screened universe with close_adj[T] > sma50_adj[T]."
    threshold_pct: 50.0  # Reference baseline threshold

  random_baseline:
    universe: "Exact screened universe on signal date T passing Gates 1-3 and Trend Filter (close_adj > sma50 > sma200)."
    draws: 1000
    seed: 42
    matching: "Trade-by-trade matched to all 198 actual entry dates."
    entry_fill: "Filled on Day T+1 at Open with 0.10% entry slippage, enforcing <= 3.0% gap cap and RR >= 1.5 at fill."
    sizing_risk: "Identical 1% risk sizing: Live stop = min(Stop A [2.0 * ATR14], Stop B [Donchian 30-day low])."
    lifecycle_exits: "Identical bar-by-bar advance_one_bar() simulation: Initial Stop, Breakeven at +1.0R, Trailing ATR, Parabolic Trailing, and 20-session Time Decay with 0.10% exit slippage."

selection_criteria:
  trade_volume_gates:
    min_pooled_trades: 80
    min_trades_per_window: 20

  statistical_significance_gates:
    stricter_confidence_interval: 99.0  # 99% circular block-bootstrap CI (block_size=4) of candidate's own weekly Net-R must be > 0.0R
    skill_vs_drift_test: >
      Westfall-Young Stepdown Max-T Studentized Circular Block Bootstrap: Resamples 4-week circular
      blocks (with modulo W wrap; Politis & Romano, 1992) simultaneously across all 6 candidate
      configurations and the matched-random baseline (B = 10,000 replications). Family-Wise Error Rate (FWER)
      threshold alpha = 0.05.
      Rationale for block bootstrap over i.i.d. weekly resampling: the strategy's weekly R-sum series exhibits
      lag-1 autocorrelation of ~0.215-0.237; i.i.d. resampling produced FWER of 2.0% at zero autocorrelation
      and 18.7% at rho=0.4 (against 5% nominal). In empirical simulations with rho=0.4, 4-week blocks achieve
      ~12.5% FWER; to ensure rigorous error control across autocorrelation structures, candidates are
      pre-registered to require FWER significance at BOTH block_size=4 AND block_size=8 (numeric requirement:
      adjusted p-value <= 0.05 at both block sizes, replacing qualitative consistency). The real paired weekly
      advantage series exhibits low autocorrelation (lag-1 ~+0.08 in W2, -0.03 pooled), making dual-block
      significance robust against false discoveries.
    bootstrap_specification:
      method: "Westfall-Young Stepdown Max-T Studentized Circular Block Bootstrap (Politis & Romano, 1992)"
      resampling_unit: "4-week circular blocks with modulo W wrap (eliminating edge oversampling bias)"
      block_size: 4
      required_block_sizes: [4, 8]  # Pre-registered requirement: candidate must achieve FWER significance (p <= 0.05) at BOTH block sizes
      sensitivity_block_sizes: [2, 4, 8]
      num_replications: 10000
      fwer_alpha: 0.05
      null_hypothesis: "H0_k: E[R_candidate_k - R_random] <= 0 for k in {1..6}"
      test_statistic: >
        Studentized paired t-statistic t_k = mean(D_k) / SE(D_k), where D_k,w is the WEEKLY SUM of
        net-R advantage of strategy over matched random trades (NOT per-trade expectancy).
        D_k,w = sum(net_r_actual, week w) - sum(net_r_random_means, week w).
      joint_distribution: >
        Simultaneous single draw of block-start indices applied jointly across all 6 configurations
        and random baseline in each replication b, preserving cross-sectional correlation and
        satisfying the subset-pivotality condition required for Westfall-Young stepdown validity.
      holding_time_basis: >
        Raw individual draws (N=987 draws for CFG-00). Max holding: 278 sessions W1, 235 sessions W2.
        17 draws exceed 85 sessions, averaging +2.53R. The previously reported 102/71 max holding
        was a maximum of 5-draw averages per trade, NOT raw draws — raw draws are the correct basis.
      power_estimates_for_300_trade_candidate:
        at_true_edge_plus_0_10R: "~40% power"
        at_true_edge_plus_0_15R: "~75% power"
        at_true_edge_plus_0_20R: "~95% power"
      absolute_edge_gate: >
        Pooled expectancy must reach >= +0.15R. Matched random baseline expectancy is approximately
        -0.01R, so the strategy must show approximately +0.16R over random to clear the gate.

  plateau_definition:
    rule: "The winning configuration must sit on a stable plateau: every neighboring config in the adjacency graph must achieve a net expectancy that drops by <= 25% from the winner's net expectancy and remains strictly positive (> 0.0R). Only the single highest-expectancy finalist emerging from Gate 3 is tested; if it fails the plateau test, the selection terminates with 'NO CANDIDATE SELECTED' (no fallback to the next candidate)."
    adjacency_graph:
      CFG-01: ["CFG-02", "CFG-04"]
      CFG-02: ["CFG-01", "CFG-03", "CFG-05"]
      CFG-03: ["CFG-02", "CFG-06"]
      CFG-04: ["CFG-01", "CFG-05"]
      CFG-05: ["CFG-04", "CFG-06", "CFG-02"]
      CFG-06: ["CFG-05", "CFG-03"]

  alpha_and_benchmark_rules:
    boolean_rule: >
      [(Strategy_CAGR >= Nifty_CAGR) OR (Strategy_Return_over_DD >= 1.5 * Nifty_Return_over_DD)]
      AND
      (Strategy_Sharpe >= Fallback_Sharpe + 0.20 AND Strategy_CAGR > Fallback_CAGR)
    sharpe_definition: "Annualized Sharpe ratio computed from daily mark-to-market equity returns with Rf = 6.5% annualized: (mean(daily_excess) / std(daily_excess)) * sqrt(252)."

  official_strategy_gates:
    min_trades: 40  # Required for the 5-year TEST window
    max_drawdown_pct: 15.0  # Maximum peak-to-trough equity-curve drawdown per window from simulator
    min_profit_factor: 1.30
    min_net_expectancy_r: 0.15

selection_automation:
  description: >
    All selection gates are applied mechanically by scripts/select_candidate.py with no manual
    discretion allowed. The script writes a committed decision file and an append-only trial
    ledger to eliminate human judgment bias. Only the single top-expectancy finalist passing Gate 3
    is plateau-tested (Gate 4); there is strictly no fallback to lower-expectancy candidates if it fails.
  script: "scripts/select_candidate.py"
  outputs:
    decision_file: "backtest/outputs/selection_decision.json"  # Committed; contains gate results + reasons
    trial_ledger: "backtest/outputs/trial_ledger.csv"          # Append-only audit log; committed
  gate_sequence:
    - gate: 1
      name: "Trade Volume Floors"
      rule: "pooled_trades >= 80 AND trades_W1 >= 20 AND trades_W2 >= 20"
    - gate: 2
      name: "99% Block Bootstrap CI Lower Bound"
      rule: "99% circular block-bootstrap CI (block_size=4) of candidate's OWN absolute weekly net-R lower bound > 0.0R (computed directly on candidate trades, decoupled from random baseline)"
    - gate: 3
      name: "Max-T FWER Significance (Dual Block Size)"
      rule: "fwer_adjusted_p_value <= 0.05 at BOTH block_size=4 AND block_size=8 (Westfall-Young Stepdown Max-T with circular block resampling)"
    - gate: 4
      name: "Plateau Check (Top Finalist Only, No Fallback)"
      rule: >
        Applied strictly to the single highest-expectancy finalist passing Gate 3: every neighbor in
        the pre-registered adjacency graph must achieve net_expectancy >= 0.75 * winner_net_expectancy
        AND net_expectancy > 0.0R. If it fails, outcome is 'NO CANDIDATE SELECTED' (no fallback).
    - gate: 5
      name: "Official Strategy Gates"
      rule: "max_drawdown_pct <= 15.0 (per-window simulator equity-curve drawdown) AND profit_factor >= 1.30 AND pooled_trades >= 80 AND net_expectancy_r >= 0.15"

step5_test_prerequisites:
  bootstrap_lower_bound_gt_zero: true
  beat_matched_random_baseline_test_alpha: 0.05  # Single-shot trial on TEST window (uncorrected alpha = 0.05)
  compliance_applied: true
  single_selected_config_only: true
  original_strategy_gates_enforced:
    max_drawdown_pct: 15.0
    min_profit_factor: 1.30
    min_trades: 40
    min_net_expectancy_r: 0.15

executable_reproducibility_test:
  test_file: "tests/unit/test_baseline_reproducibility.py"
  test_command: "py -3 -m pytest tests/unit/test_baseline_reproducibility.py"
  target_assertions:
    w1: { trades: 39, net_pnl: 229083, net_expectancy_r: 0.547 }
    w2: { trades: 159, net_pnl: -164616, net_expectancy_r: -0.104 }
    pooled: { trades: 198, net_pnl: 64468, net_expectancy_r: 0.024 }

configs:
  - id: "CFG-00"
    role: "REFERENCE_BASELINE"
    name: "Baseline Unfiltered Breakout"
    entry_filters:
      trend_filter_enabled: true
      trend_fast_sma: 50
      trend_slow_sma: 200
      breakout_required: true
      pullback_required: false
      breakout_lookback: 20
      rs_rank_percentile: null          # 100% of breakout candidates allowed
    execution:
      max_entry_gap_up_pct: 3.0         # Exactly matches strategy_config.yaml baseline
    description: "Current baseline: 50>200 SMA trend, 20-day high breakout confirmation, max gap 3.0%."

  - id: "CFG-01"
    role: "CANDIDATE"
    name: "Trend Continuation (RS Top 50%, Gap <= 1.5%)"
    entry_filters:
      trend_filter_enabled: true
      trend_fast_sma: 50
      trend_slow_sma: 200
      breakout_required: false          # No breakout trigger
      pullback_required: false
      rs_rank_percentile: 50            # Top 50% RS rank
    execution:
      max_entry_gap_up_pct: 1.5
    description: "Broad trend continuation: uptrending stocks (close > sma50 > sma200) in top 50% RS without breakout trigger, gap <= 1.5%."

  - id: "CFG-02"
    role: "CANDIDATE"
    name: "Trend Continuation (RS Top 40%, Gap <= 1.5%)"
