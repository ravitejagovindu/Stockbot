    description: "Moderate trend continuation: uptrending stocks (close > sma50 > sma200) in top 40% RS without breakout trigger, gap <= 1.5%."

  - id: "CFG-03"
    role: "CANDIDATE"
    name: "Trend Continuation (RS Top 30%, Gap <= 1.5%)"
