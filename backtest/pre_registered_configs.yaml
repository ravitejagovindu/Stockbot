      pullback_sma_period: 20
      pullback_tolerance_lower: 0.98
      pullback_tolerance_upper: 1.03
      rs_rank_percentile: 50
    execution:
      max_entry_gap_up_pct: 1.5
    description: "Broad pullback entry: top 50% RS stocks in 50>200 uptrend pulling back within [0.98, 1.03] of 20-day SMA, gap <= 1.5%."

  - id: "CFG-05"
    role: "CANDIDATE"
